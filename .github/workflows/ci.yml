name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: python -m pytest
      - run: python -m compileall sports_vision app.py

  real-inference-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUN_REAL_INFERENCE: "1"
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[vision,dev]"
      - run: python -m pytest -s -m integration tests/test_real_inference.py
